<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"><title id="title">Non-inverting op-amp amplifier</title><desc id="desc">Op-amp with feedback divider and gain equation</desc><style>text{font-family:Arial,sans-serif;fill:#e5e7eb}.label{font-size:15px}.small{font-size:12px;fill:#94a3b8}.wire{stroke:#f59e0b;stroke-width:3;fill:none}.part{stroke:#6ee7b7;stroke-width:3;fill:none}.axis{stroke:#64748b;stroke-width:2}.plot{stroke:#60a5fa;stroke-width:4;fill:none}.node{fill:#f8fafc}.block{fill:#172033;stroke:#6ee7b7;stroke-width:2}</style><rect width="920" height="420" fill="#0b1020"/><text x="460" y="38" font-size="24" text-anchor="middle">Non-inverting op-amp amplifier</text><path d="M390 115 L390 285 L560 200 Z" class="part"/><text x="410" y="170" text-anchor="middle" class="label">+</text><text x="410" y="260" text-anchor="middle" class="label">−</text><text x="235" y="170" text-anchor="middle" class="label">Vin</text><path d="M260 165 L390 165" class="wire"/><path d="M390 255 L330 255" class="wire"/><path d="M180 255 L205 255" class="wire"/><path d="M205 255 l12 -12 20 24 20 -24 20 24 20 -24 12 12" class="part"/><path d="M305 255 L330 255" class="wire"/><text x="255" y="227" text-anchor="middle" class="label">Rg</text><path d="M180 255 L180 320" class="wire"/><path d="M180 320 L180 338" class="wire"/><path d="M158 338 L202 338" class="axis"/><path d="M166 346 L194 346" class="axis"/><path d="M174 354 L186 354" class="axis"/><path d="M390 255 L415 255" class="wire"/><path d="M415 255 l12 -12 20 24 20 -24 20 24 20 -24 12 12" class="part"/><path d="M595 255 L620 255" class="wire"/><text x="505" y="227" text-anchor="middle" class="label">Rf</text><path d="M620 255 L620 210" class="wire"/><path d="M620 210 L560 210" class="wire"/><path d="M560 210 L720 210" class="wire"/><text x="760" y="215" text-anchor="start" class="label">Vout</text><text x="460" y="355" text-anchor="middle" class="label">Gain = 1 + Rf/Rg</text></svg>