<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"><title id="title">First-order RC low-pass filter</title><desc id="desc">Resistor feeding a shunt capacitor with input and output nodes</desc><style>text{font-family:Arial,sans-serif;fill:#e5e7eb}.label{font-size:15px}.small{font-size:12px;fill:#94a3b8}.wire{stroke:#f59e0b;stroke-width:3;fill:none}.part{stroke:#6ee7b7;stroke-width:3;fill:none}.axis{stroke:#64748b;stroke-width:2}.plot{stroke:#60a5fa;stroke-width:4;fill:none}.node{fill:#f8fafc}.block{fill:#172033;stroke:#6ee7b7;stroke-width:2}</style><rect width="920" height="420" fill="#0b1020"/><text x="460" y="38" font-size="24" text-anchor="middle">First-order RC low-pass filter</text><text x="105" y="180" text-anchor="middle" class="label">Vin</text><path d="M130 175 L240 175" class="wire"/><path d="M240 175 L265 175" class="wire"/><path d="M265 175 l12 -12 20 24 20 -24 20 24 20 -24 12 12" class="part"/><path d="M445 175 L470 175" class="wire"/><text x="355" y="147" text-anchor="middle" class="label">R</text><path d="M470 175 L690 175" class="wire"/><circle cx="690" cy="175" r="7" class="node"/><text x="740" y="180" text-anchor="start" class="label">Vout</text><path d="M690 175 L690 245" class="wire"/><path d="M650 245 h80 M650 265 h80" class="part"/><text x="755" y="260" text-anchor="start" class="label">C</text><path d="M690 265 L690 320" class="wire"/><path d="M690 320 L690 338" class="wire"/><path d="M668 338 L712 338" class="axis"/><path d="M676 346 L704 346" class="axis"/><path d="M684 354 L696 354" class="axis"/><text x="455" y="380" text-anchor="middle" class="label">fc = 1/(2πRC); source and load impedance modify the ideal result</text></svg>