<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"><title id="title">Serial protocol timing</title><desc id="desc">Representative UART SPI and I2C digital waveforms</desc><style>text{font-family:Arial,sans-serif;fill:#e5e7eb}.label{font-size:15px}.small{font-size:12px;fill:#94a3b8}.wire{stroke:#f59e0b;stroke-width:3;fill:none}.part{stroke:#6ee7b7;stroke-width:3;fill:none}.axis{stroke:#64748b;stroke-width:2}.plot{stroke:#60a5fa;stroke-width:4;fill:none}.node{fill:#f8fafc}.block{fill:#172033;stroke:#6ee7b7;stroke-width:2}</style><rect width="920" height="420" fill="#0b1020"/><text x="460" y="38" font-size="24" text-anchor="middle">Serial protocol timing</text><text x="70" y="100" text-anchor="start" class="label">UART</text><path d="M150 95 L820 95" class="axis"/><path d="M150 70 V120 H230 V70 H300 V120 H390 V70 H480 V120 H560 V70 H700 V120 H780 V70" class="plot"/><text x="70" y="220" text-anchor="start" class="label">SPI</text><path d="M150 180 L820 180" class="axis"/><path d="M150 210 h50 v-60 h50 v60 h50 v-60 h50 v60 h50 v-60 h50 v60 h50 v-60 h50 v60" class="part"/><text x="70" y="330" text-anchor="start" class="label">I²C</text><path d="M150 290 L820 290" class="axis"/><path d="M150 260 h80 v60 h80 v-60 h80 v60 h80 v-60 h80 v60 h80 v-60 h80" class="plot"/><text x="455" y="390" text-anchor="middle" class="label">Always verify voltage levels, reference, timing, framing, and termination</text></svg>