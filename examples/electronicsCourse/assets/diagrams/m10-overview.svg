<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"><title id="title">Relay flyback current path</title><desc id="desc">Low-side transistor relay driver with flyback diode</desc><style>text{font-family:Arial,sans-serif;fill:#e5e7eb}.label{font-size:15px}.small{font-size:12px;fill:#94a3b8}.wire{stroke:#f59e0b;stroke-width:3;fill:none}.part{stroke:#6ee7b7;stroke-width:3;fill:none}.axis{stroke:#64748b;stroke-width:2}.plot{stroke:#60a5fa;stroke-width:4;fill:none}.node{fill:#f8fafc}.block{fill:#172033;stroke:#6ee7b7;stroke-width:2}</style><rect width="920" height="420" fill="#0b1020"/><text x="460" y="38" font-size="24" text-anchor="middle">Relay flyback current path</text><path d="M160 90 L660 90" class="wire"/><text x="160" y="72" text-anchor="middle" class="label">+12 V</text><path d="M300 90 L300 140" class="wire"/><rect x="255" y="140" width="90" height="100" rx="8" class="block"/><text x="300" y="190" text-anchor="middle" class="label">COIL</text><path d="M300 240 L300 300" class="wire"/><path d="M280 300 L320 300 L300 340 Z" class="part"/><path d="M300 340 L300 365" class="wire"/><path d="M300 365 L300 383" class="wire"/><path d="M278 383 L322 383" class="axis"/><path d="M286 391 L314 391" class="axis"/><path d="M294 399 L306 399" class="axis"/><path d="M460 110 L460 240" class="wire"/><path d="M440 150 h40 M440 170 h40" class="part"/><text x="515" y="165" text-anchor="start" class="label">Flyback diode</text><path d="M460 110 L300 110" class="wire"/><path d="M460 240 L300 240" class="wire"/><text x="570" y="285" text-anchor="middle" class="label">Coil current continues after switch-off</text></svg>