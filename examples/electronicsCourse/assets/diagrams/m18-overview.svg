<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"><title id="title">BJT low-side relay driver</title><desc id="desc">GPIO drives NPN base resistor and relay coil with flyback protection</desc><style>text{font-family:Arial,sans-serif;fill:#e5e7eb}.label{font-size:15px}.small{font-size:12px;fill:#94a3b8}.wire{stroke:#f59e0b;stroke-width:3;fill:none}.part{stroke:#6ee7b7;stroke-width:3;fill:none}.axis{stroke:#64748b;stroke-width:2}.plot{stroke:#60a5fa;stroke-width:4;fill:none}.node{fill:#f8fafc}.block{fill:#172033;stroke:#6ee7b7;stroke-width:2}</style><rect width="920" height="420" fill="#0b1020"/><text x="460" y="38" font-size="24" text-anchor="middle">BJT low-side relay driver</text><text x="90" y="230" text-anchor="start" class="label">GPIO</text><path d="M150 225 L220 225" class="wire"/><path d="M220 225 L245 225" class="wire"/><path d="M245 225 l12 -12 20 24 20 -24 20 24 20 -24 12 12" class="part"/><path d="M365 225 L390 225" class="wire"/><text x="305" y="197" text-anchor="middle" class="label">Rb</text><path d="M390 225 L455 225" class="wire"/><circle cx="470" cy="225" r="35" class="part"/><text x="470" y="230" text-anchor="middle" class="label">NPN</text><path d="M470 190 L470 120" class="wire"/><rect x="425" y="70" width="90" height="50" class="block"/><text x="470" y="101" text-anchor="middle" class="label">RELAY</text><path d="M470 70 L470 55" class="wire"/><text x="470" y="48" text-anchor="middle" class="label">+12 V</text><path d="M470 260 L470 325" class="wire"/><path d="M470 325 L470 343" class="wire"/><path d="M448 343 L492 343" class="axis"/><path d="M456 351 L484 351" class="axis"/><path d="M464 359 L476 359" class="axis"/><text x="650" y="120" text-anchor="middle" class="label">Diode across coil</text></svg>