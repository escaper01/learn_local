<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"><title id="title">Two-pole Bode magnitude</title><desc id="desc">Magnitude plot with corners at 100 hertz and 10 kilohertz</desc><style>text{font-family:Arial,sans-serif;fill:#e5e7eb}.label{font-size:15px}.small{font-size:12px;fill:#94a3b8}.wire{stroke:#f59e0b;stroke-width:3;fill:none}.part{stroke:#6ee7b7;stroke-width:3;fill:none}.axis{stroke:#64748b;stroke-width:2}.plot{stroke:#60a5fa;stroke-width:4;fill:none}.node{fill:#f8fafc}.block{fill:#172033;stroke:#6ee7b7;stroke-width:2}</style><rect width="920" height="420" fill="#0b1020"/><text x="460" y="38" font-size="24" text-anchor="middle">Two-pole Bode magnitude</text><path d="M100 330 L850 330" class="axis"/><path d="M100 330 L100 70" class="axis"/><path d="M100 100 L315 100" class="plot"/><path d="M315 100 L620 210" class="plot"/><path d="M620 210 L830 330" class="plot"/><path d="M315 330 L315 80" class="axis"/><path d="M620 330 L620 80" class="axis"/><text x="315" y="355" text-anchor="middle" class="label">100 Hz</text><text x="620" y="355" text-anchor="middle" class="label">10 kHz</text><text x="470" y="165" text-anchor="middle" class="label">−20 dB/dec</text><text x="735" y="255" text-anchor="middle" class="label">−40 dB/dec</text><text x="75" y="105" text-anchor="end" class="label">0 dB</text></svg>