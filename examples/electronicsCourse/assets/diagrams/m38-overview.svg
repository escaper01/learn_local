<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"><title id="title">Connector protection and filtering</title><desc id="desc">External connector followed by TVS current limiting filter and protected input</desc><style>text{font-family:Arial,sans-serif;fill:#e5e7eb}.label{font-size:15px}.small{font-size:12px;fill:#94a3b8}.wire{stroke:#f59e0b;stroke-width:3;fill:none}.part{stroke:#6ee7b7;stroke-width:3;fill:none}.axis{stroke:#64748b;stroke-width:2}.plot{stroke:#60a5fa;stroke-width:4;fill:none}.node{fill:#f8fafc}.block{fill:#172033;stroke:#6ee7b7;stroke-width:2}</style><rect width="920" height="420" fill="#0b1020"/><text x="460" y="38" font-size="24" text-anchor="middle">Connector protection and filtering</text><rect x="80" y="150" width="120" height="90" class="block"/><text x="140" y="190" text-anchor="middle" class="label">EXTERNAL</text><text x="140" y="212" text-anchor="middle" class="label">CONNECTOR</text> <path d="M200 195 L300 195" class="wire"/><path d="M300 150 v90 M280 175 h40 M280 215 h40" class="part"/><text x="300" y="135" text-anchor="middle" class="label">TVS</text><path d="M300 240 L300 300" class="wire"/><path d="M300 300 L300 318" class="wire"/><path d="M278 318 L322 318" class="axis"/><path d="M286 326 L314 326" class="axis"/><path d="M294 334 L306 334" class="axis"/><path d="M300 195 L325 195" class="wire"/><path d="M325 195 l12 -12 20 24 20 -24 20 24 20 -24 12 12" class="part"/><path d="M475 195 L500 195" class="wire"/><text x="400" y="167" text-anchor="middle" class="label">R/FERRITE</text><path d="M500 195 L610 195" class="wire"/><path d="M610 165 v60 M590 180 h40 M590 210 h40" class="part"/><path d="M610 225 L610 300" class="wire"/><path d="M610 300 L610 318" class="wire"/><path d="M588 318 L632 318" class="axis"/><path d="M596 326 L624 326" class="axis"/><path d="M604 334 L616 334" class="axis"/><path d="M610 195 L780 195" class="wire"/><text x="820" y="200" text-anchor="start" class="label">IC input</text><text x="455" y="365" text-anchor="middle" class="label">Divert surge current at the boundary; filter the residual without corrupting the wanted signal</text></svg>