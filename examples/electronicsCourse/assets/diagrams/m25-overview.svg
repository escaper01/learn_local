<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"><title id="title">Microcontroller system boundaries</title><desc id="desc">MCU core connected to GPIO timers ADC communications reset and watchdog</desc><style>text{font-family:Arial,sans-serif;fill:#e5e7eb}.label{font-size:15px}.small{font-size:12px;fill:#94a3b8}.wire{stroke:#f59e0b;stroke-width:3;fill:none}.part{stroke:#6ee7b7;stroke-width:3;fill:none}.axis{stroke:#64748b;stroke-width:2}.plot{stroke:#60a5fa;stroke-width:4;fill:none}.node{fill:#f8fafc}.block{fill:#172033;stroke:#6ee7b7;stroke-width:2}</style><rect width="920" height="420" fill="#0b1020"/><text x="460" y="38" font-size="24" text-anchor="middle">Microcontroller system boundaries</text><rect x="350" y="145" width="220" height="130" rx="14" class="block"/><text x="460" y="205" text-anchor="middle" class="label">MCU CORE</text><text x="460" y="230" text-anchor="middle" class="label">CPU • FLASH • RAM</text><rect x="110" y="80" width="160" height="55" rx="8" class="block"/><text x="190" y="113" text-anchor="middle" class="label">GPIO</text><path d="M190 135 L460 145" class="wire"/><rect x="350" y="70" width="160" height="55" rx="8" class="block"/><text x="430" y="103" text-anchor="middle" class="label">CLOCK/RESET</text><path d="M430 125 L460 145" class="wire"/><rect x="650" y="80" width="160" height="55" rx="8" class="block"/><text x="730" y="113" text-anchor="middle" class="label">UART/SPI/I²C</text><path d="M730 135 L460 145" class="wire"/><rect x="105" y="300" width="160" height="55" rx="8" class="block"/><text x="185" y="333" text-anchor="middle" class="label">TIMERS/PWM</text><path d="M185 300 L460 275" class="wire"/><rect x="350" y="330" width="160" height="55" rx="8" class="block"/><text x="430" y="363" text-anchor="middle" class="label">ADC/DAC</text><path d="M430 330 L460 275" class="wire"/><rect x="660" y="305" width="160" height="55" rx="8" class="block"/><text x="740" y="338" text-anchor="middle" class="label">WATCHDOG</text><path d="M740 305 L460 275" class="wire"/></svg>