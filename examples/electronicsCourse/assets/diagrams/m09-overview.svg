<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"><title id="title">RC charging transient</title><desc id="desc">Exponential capacitor voltage with time-constant markers</desc><style>text{font-family:Arial,sans-serif;fill:#e5e7eb}.label{font-size:15px}.small{font-size:12px;fill:#94a3b8}.wire{stroke:#f59e0b;stroke-width:3;fill:none}.part{stroke:#6ee7b7;stroke-width:3;fill:none}.axis{stroke:#64748b;stroke-width:2}.plot{stroke:#60a5fa;stroke-width:4;fill:none}.node{fill:#f8fafc}.block{fill:#172033;stroke:#6ee7b7;stroke-width:2}</style><rect width="920" height="420" fill="#0b1020"/><text x="460" y="38" font-size="24" text-anchor="middle">RC charging transient</text><path d="M100 340 L850 340" class="axis"/><path d="M100 340 L100 75" class="axis"/><path d="M100 340 C180 170 290 95 820 85" class="plot"/><path d="M245 340 L245 180" class="axis"/><path d="M435 340 L435 105" class="axis"/><text x="245" y="365" text-anchor="middle" class="label">1τ</text><text x="435" y="365" text-anchor="middle" class="label">3τ</text><text x="820" y="365" text-anchor="middle" class="label">5τ</text><text x="72" y="345" text-anchor="end" class="small">0 V</text><text x="72" y="188" text-anchor="end" class="small">63%</text><text x="72" y="92" text-anchor="end" class="small">99%</text><text x="505" y="62" text-anchor="middle" class="label">Vc(t)=Vs(1−e^(−t/RC))</text></svg>