<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"><title id="title">Kirchhoff current law at a node</title><desc id="desc">Three branch currents meeting at a node with signed directions</desc><style>text{font-family:Arial,sans-serif;fill:#e5e7eb}.label{font-size:15px}.small{font-size:12px;fill:#94a3b8}.wire{stroke:#f59e0b;stroke-width:3;fill:none}.part{stroke:#6ee7b7;stroke-width:3;fill:none}.axis{stroke:#64748b;stroke-width:2}.plot{stroke:#60a5fa;stroke-width:4;fill:none}.node{fill:#f8fafc}.block{fill:#172033;stroke:#6ee7b7;stroke-width:2}</style><rect width="920" height="420" fill="#0b1020"/><text x="460" y="38" font-size="24" text-anchor="middle">Kirchhoff current law at a node</text><path d="M150 210 L450 210" class="wire"/><path d="M450 210 L760 100" class="wire"/><path d="M450 210 L760 320" class="wire"/><circle cx="450" cy="210" r="9" class="node"/><text x="450" y="190" text-anchor="middle" class="label">Node Vx</text><text x="260" y="190" text-anchor="middle" class="label">I1 →</text><text x="620" y="135" text-anchor="middle" class="label">→ I2</text><text x="620" y="290" text-anchor="middle" class="label">→ I3</text><text x="450" y="365" text-anchor="middle" class="label">KCL: I1 − I2 − I3 = 0</text></svg>