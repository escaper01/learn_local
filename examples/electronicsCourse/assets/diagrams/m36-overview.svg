<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"><title id="title">PCB placement follows current loops</title><desc id="desc">Two-layer board concept showing compact switching loop and continuous return</desc><style>text{font-family:Arial,sans-serif;fill:#e5e7eb}.label{font-size:15px}.small{font-size:12px;fill:#94a3b8}.wire{stroke:#f59e0b;stroke-width:3;fill:none}.part{stroke:#6ee7b7;stroke-width:3;fill:none}.axis{stroke:#64748b;stroke-width:2}.plot{stroke:#60a5fa;stroke-width:4;fill:none}.node{fill:#f8fafc}.block{fill:#172033;stroke:#6ee7b7;stroke-width:2}</style><rect width="920" height="420" fill="#0b1020"/><text x="460" y="38" font-size="24" text-anchor="middle">PCB placement follows current loops</text><rect x="90" y="75" width="740" height="280" rx="15" fill="#123524" stroke="#6ee7b7" stroke-width="3"/><text x="145" y="105" text-anchor="start" class="label">PCB</text><rect x="170" y="145" width="120" height="70" class="block"/><text x="230" y="185" text-anchor="middle" class="label">INPUT</text><text x="410" y="125" text-anchor="middle" class="label">POWER STAGE</text><rect x="360" y="145" width="160" height="70" class="block"/><text x="440" y="185" text-anchor="middle" class="label">SW + L</text><path d="M290 180 L360 180" class="wire"/><path d="M360 235 C300 290 520 310 520 215" stroke="#f59e0b" stroke-width="7" fill="none"/><text x="430" y="295" text-anchor="middle" class="label">compact high-di/dt loop</text><rect x="620" y="145" width="120" height="70" class="block"/><text x="680" y="185" text-anchor="middle" class="label">LOAD</text><path d="M520 180 L620 180" class="wire"/><path d="M170 255 L740 255" class="axis"/><text x="455" y="340" text-anchor="middle" class="label">Continuous reference plane provides the shortest return directly under each signal</text></svg>