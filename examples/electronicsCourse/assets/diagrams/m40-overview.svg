<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"><title id="title">Evidence-first troubleshooting flow</title><desc id="desc">Safe diagnostic sequence from symptom to verified repair</desc><style>text{font-family:Arial,sans-serif;fill:#e5e7eb}.label{font-size:15px}.small{font-size:12px;fill:#94a3b8}.wire{stroke:#f59e0b;stroke-width:3;fill:none}.part{stroke:#6ee7b7;stroke-width:3;fill:none}.axis{stroke:#64748b;stroke-width:2}.plot{stroke:#60a5fa;stroke-width:4;fill:none}.node{fill:#f8fafc}.block{fill:#172033;stroke:#6ee7b7;stroke-width:2}</style><rect width="920" height="420" fill="#0b1020"/><text x="460" y="38" font-size="24" text-anchor="middle">Evidence-first troubleshooting flow</text><rect x="60" y="155" width="130" height="75" rx="10" class="block"/><text x="125" y="185" text-anchor="middle" class="label">Reproduce</text><text x="125" y="207" text-anchor="middle" class="label">safely</text><path d="M190 192 L235 192" class="wire"/><rect x="235" y="155" width="130" height="75" rx="10" class="block"/><text x="300" y="185" text-anchor="middle" class="label">Measure</text><text x="300" y="207" text-anchor="middle" class="label">source</text><path d="M365 192 L410 192" class="wire"/><rect x="410" y="155" width="130" height="75" rx="10" class="block"/><text x="475" y="185" text-anchor="middle" class="label">Split</text><text x="475" y="207" text-anchor="middle" class="label">by block</text><path d="M540 192 L585 192" class="wire"/><rect x="585" y="155" width="130" height="75" rx="10" class="block"/><text x="650" y="185" text-anchor="middle" class="label">Test</text><text x="650" y="207" text-anchor="middle" class="label">hypothesis</text><path d="M715 192 L760 192" class="wire"/><rect x="760" y="155" width="130" height="75" rx="10" class="block"/><text x="825" y="185" text-anchor="middle" class="label">Verify</text><text x="825" y="207" text-anchor="middle" class="label">repair</text><text x="460" y="95" text-anchor="middle" class="label">one change • one prediction • one discriminating measurement</text><text x="460" y="305" text-anchor="middle" class="label">Record symptom → expected evidence → measured evidence → cause → regression test</text></svg>