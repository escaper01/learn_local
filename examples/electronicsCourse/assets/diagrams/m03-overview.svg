<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"><title id="title">Ohm's law and reference directions</title><desc id="desc">A source, resistor and LED load with labeled voltage and current</desc><style>text{font-family:Arial,sans-serif;fill:#e5e7eb}.label{font-size:15px}.small{font-size:12px;fill:#94a3b8}.wire{stroke:#f59e0b;stroke-width:3;fill:none}.part{stroke:#6ee7b7;stroke-width:3;fill:none}.axis{stroke:#64748b;stroke-width:2}.plot{stroke:#60a5fa;stroke-width:4;fill:none}.node{fill:#f8fafc}.block{fill:#172033;stroke:#6ee7b7;stroke-width:2}</style><rect width="920" height="420" fill="#0b1020"/><text x="460" y="38" font-size="24" text-anchor="middle">Ohm's law and reference directions</text><path d="M160 100 L160 300" class="wire"/><path d="M160 100 L320 100" class="wire"/><path d="M320 100 L345 100" class="wire"/><path d="M345 100 l12 -12 20 24 20 -24 20 24 20 -24 12 12" class="part"/><path d="M495 100 L520 100" class="wire"/><text x="420" y="72" text-anchor="middle" class="label">R = 750 Ω</text><path d="M520 100 L690 100" class="wire"/><path d="M690 82 v36 m-18 -18 h36" class="part"/><text x="690" y="145" text-anchor="middle" class="label">LED ≈ 2 V</text><path d="M690 100 L690 300" class="wire"/><path d="M690 300 L160 300" class="wire"/><path d="M160 150 v100 M140 180 h40 M148 220 h24" class="part"/><text x="118" y="205" text-anchor="middle" class="label">9 V</text><text x="430" y="270" text-anchor="middle" class="label">I ≈ 9.3 mA →</text><text x="430" y="345" text-anchor="middle" class="label">KVL: 9 V − IR − VLED = 0</text></svg>