<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"><title id="title">AC waveform measurements</title><desc id="desc">Sine and pulse waveforms showing amplitude period and duty cycle</desc><style>text{font-family:Arial,sans-serif;fill:#e5e7eb}.label{font-size:15px}.small{font-size:12px;fill:#94a3b8}.wire{stroke:#f59e0b;stroke-width:3;fill:none}.part{stroke:#6ee7b7;stroke-width:3;fill:none}.axis{stroke:#64748b;stroke-width:2}.plot{stroke:#60a5fa;stroke-width:4;fill:none}.node{fill:#f8fafc}.block{fill:#172033;stroke:#6ee7b7;stroke-width:2}</style><rect width="920" height="420" fill="#0b1020"/><text x="460" y="38" font-size="24" text-anchor="middle">AC waveform measurements</text><path d="M80 190 L840 190" class="axis"/><path d="M80 190 C130 80 180 80 230 190 S330 300 380 190 S480 80 530 190 S630 300 680 190 S780 80 830 190" class="plot"/><path d="M80 350 L840 350" class="axis"/><path d="M80 350 V270 H220 V350 H360 V270 H500 V350 H640 V270 H780 V350" class="part"/><text x="220" y="245" text-anchor="middle" class="label">25% duty pulse</text><text x="455" y="105" text-anchor="middle" class="label">sine: Vrms = Vpk/√2</text><text x="455" y="400" text-anchor="middle" class="label">period T = 1/f</text></svg>