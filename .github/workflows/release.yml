name: Release Windows build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:win
      - name: Package the Java curriculum for the release
        shell: bash
        run: |
          npm run curriculum:package
          cp javaCourse.learnpack javaCourse.zip
      - name: Attach curriculum archive to the release
        shell: bash
        run: gh release upload "${{ github.ref_name }}" javaCourse.zip --clobber
